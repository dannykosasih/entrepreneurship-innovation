# Root configuration for the Cloud Build autodetected repository trigger.
# Image destination and Build -> Push -> Deploy sequence match successful
# build 8edb323d-bfcc-4a9e-aa9f-6bffe7d1df61 (commit 93660c1).
# Update only the image of the existing service; preserve runtime settings.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/entrepreneurship-innovation/entrepreneurship-innovation:$COMMIT_SHA
      - --file
      - Dockerfile
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/entrepreneurship-innovation/entrepreneurship-innovation:$COMMIT_SHA
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - entrepreneurship-innovation
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/entrepreneurship-innovation/entrepreneurship-innovation:$COMMIT_SHA
      - --region=europe-west1
      - --project=$PROJECT_ID
      - --quiet
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/entrepreneurship-innovation/entrepreneurship-innovation:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
